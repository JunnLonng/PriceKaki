name: Update Supermarket Prices

on:
  schedule:
    # Run once daily at 6:00 AM SGT (SGT is UTC+8, so 10:00 PM UTC the night before)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger from Actions UI

permissions:
  contents: write # Required to push updates back to the repository

jobs:
  update-supermarkets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scripts/scrape_supermarkets.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/supermarket_data.json data/supermarket/
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update supermarket prices" && git pull --rebase origin main && git push)
